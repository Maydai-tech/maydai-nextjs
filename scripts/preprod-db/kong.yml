_format_version: '2.1'

# Upstreams par nom de conteneur (uniques, même vus depuis le réseau prod).
# Les clés sont injectées au démarrage depuis .env (voir entrypoint kong dans docker-compose.yml).
consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    url: http://preprod-auth:9999/
    routes:
      - name: auth-v1-route
        paths:
          - /auth/v1/
        strip_path: true
    plugins:
      - name: cors

  - name: rest-v1
    url: http://preprod-rest:3000/
    routes:
      - name: rest-v1-route
        paths:
          - /rest/v1/
        strip_path: true
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
          key_names:
            - apikey
          run_on_preflight: false

  - name: storage-v1
    url: http://preprod-storage:5000/
    routes:
      - name: storage-v1-route
        paths:
          - /storage/v1/
        strip_path: true
    plugins:
      - name: cors
