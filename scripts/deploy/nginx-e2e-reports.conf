# Site nginx :8080 — rapports e2e publics, JSON monitoring localhost-only.
# Déployé en /etc/nginx/sites-available/e2e-reports

server {
    listen 8080;
    server_name _;

    location / {
        alias /var/www/e2e-reports/;
        autoindex on;
        autoindex_format html;
    }

    location /monitoring/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        alias /var/www/monitoring/;
        default_type application/json;
        access_log off;
    }
}
