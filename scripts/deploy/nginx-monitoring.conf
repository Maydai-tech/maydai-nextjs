# Variante nginx : /monitoring/ n’est plus anonyme.
# Option A — localhost only (recommandé sur l’écoute IP :80)

location /monitoring/ {
    allow 127.0.0.1;
    deny all;
    default_type application/json;
    alias /var/www/monitoring/;
}

